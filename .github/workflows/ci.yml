name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:      # used by release.yml
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]   # 24.04: newest image that still has Python 3.9
        python: ["3.9", "3.12"]
    env:
      PYTHONUTF8: "1"
      BCAGENT_NO_UPDATE: "1"
      BCAGENT_NO_PACKAGES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e . pytest
      - name: Git identity for the git tests
        run: |
          git config --global user.name "bcagent CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - name: Tests
        run: python -m pytest -q tests
      - name: Smoke test the CLI
        run: |
          bcagent --version
          bcagent --help
          bcagent colab list
          bcagent github status
